name: Deploy to Zoho Catalyst

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Install Project Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      - name: Deploy to Catalyst Production
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: catalyst deploy --token $CATALYST_TOKEN --project BluewudCoreDev --env Production
